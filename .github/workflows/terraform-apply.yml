name: Terraform Apply

on:
  workflow_dispatch:

concurrency:
  group: heidis-place-terraform
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: terraform-plan
    defaults:
      run:
        working-directory: infra
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require main branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9

      - name: Check Terraform CI configuration
        run: |
          test -n "$AWS_ROLE_ARN"
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY"
          test -n "$TF_STATE_REGION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Create backend configuration
        run: |
          cat > backend_override.tf <<'BACKEND'
          terraform {
            backend "s3" {}
          }
          BACKEND

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Render plan
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-apply-plan
          path: |
            infra/tfplan
            infra/tfplan.txt
          retention-days: 1

  apply:
    runs-on: ubuntu-latest
    needs: plan
    environment: terraform-apply
    defaults:
      run:
        working-directory: infra
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require main branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9

      - name: Check Terraform CI configuration
        run: |
          test -n "$AWS_ROLE_ARN"
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY"
          test -n "$TF_STATE_REGION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Create backend configuration
        run: |
          cat > backend_override.tf <<'BACKEND'
          terraform {
            backend "s3" {}
          }
          BACKEND

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-apply-plan
          path: infra

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
